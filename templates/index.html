<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TCP Socket Web Chat</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app">

    <aside class="sidebar">
        <h2>TCP Web Chat</h2>
        <p class="subtitle">Python Socket Programming Backend</p>

        <div class="card">
            <label>Server IP</label>
            <input type="text" id="serverIp" value="127.0.0.1">

            <label>Port</label>
            <input type="number" id="serverPort" value="12345">

            <label>Username</label>
            <input type="text" id="username" placeholder="Ali">

            <button id="connectBtn" onclick="connectToServer()">Connect</button>
            <button id="disconnectBtn" onclick="disconnectFromServer()" disabled>Disconnect</button>
        </div>

        <div class="card">
            <h3>Online Users</h3>
            <ul id="usersList"></ul>
        </div>
    </aside>

    <main class="chat-area">
        <header class="chat-header">
            <div>
                <h1>Real-Time TCP Chat Room</h1>
                <p id="connectionStatus">Not connected</p>
            </div>
            <div class="status-pill" id="statusPill">OFFLINE</div>
        </header>

        <section class="messages" id="messages"></section>

        <section class="message-input">
            <input type="text" id="messageBox" placeholder="Type your message..." disabled>
            <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
        </section>
    </main>

    <aside class="proof-panel">
        <h2>Message Proof</h2>
        <p class="subtitle">Sent → Server Received → Delivered</p>

        <div id="proofLog" class="proof-log"></div>
    </aside>

</div>

<script src="/static/app.js"></script>
</body>
</html>
